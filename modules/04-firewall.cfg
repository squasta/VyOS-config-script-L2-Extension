# Définition des groupes réseaux
# delete firewall group network-group TRUSTED_NETS
# set firewall group network-group TRUSTED_NETS network '192.168.10.0/24'
# set firewall group network-group TRUSTED_NETS network '192.168.20.0/24'

# 1. Trafic à destination du routeur lui-même (Input)
# set firewall ipv4 input filter default-action 'drop'
# set firewall ipv4 input filter rule 10 action 'accept'
# set firewall ipv4 input filter rule 10 state established 'enable'
# set firewall ipv4 input filter rule 10 state related 'enable'

# set firewall ipv4 input filter rule 20 action 'accept'
# set firewall ipv4 input filter rule 20 protocol 'icmp'

# set firewall ipv4 input filter rule 30 action 'accept'
# set firewall ipv4 input filter rule 30 destination port '22'
# set firewall ipv4 input filter rule 30 protocol 'tcp'
# set firewall ipv4 input filter rule 30 source group network-group 'TRUSTED_NETS'

# 2. Trafic traversant le routeur (Forward)
# set firewall ipv4 forward filter default-action 'drop'
# set firewall ipv4 forward filter rule 10 action 'accept'
# set firewall ipv4 forward filter rule 10 state established 'enable'
# set firewall ipv4 forward filter rule 10 state related 'enable'

# set firewall ipv4 forward filter rule 20 action 'accept'
# set firewall ipv4 forward filter rule 20 outbound-interface name 'eth0'
# set firewall ipv4 forward filter rule 20 source group network-group 'TRUSTED_NETS'