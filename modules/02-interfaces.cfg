# Interface Datacenter (DHCP ou IP fixe)
set interfaces ethernet eth0 address '10.0.100.100/8'
# set interfaces ethernet eth0 address "dhcp"
set interfaces ethernet eth0 description "VLAN DC"
set interfaces ethernet eth0 mtu 1454

# Interface VLAN à étendre 
set interfaces ethernet eth1 description 'VLAN_2_EXTEND'

# Interface VXLAN
set interfaces vxlan vxlan1 port "4789"
set interfaces vxlan vxlan1 source-address "10.0.100.100"
set interfaces vxlan vxlan1 vni "1234"
set interfaces vxlan vxlan1 mtu "1392"
# Remote VXLAN endpoint = address of the remote VXLAN peer (Floating IP NC2)
set interfaces vxlan vxlan1 remote "172.21.0.8"

# Interface Bridge
set interfaces bridge br1 member interface eth1
set interfaces bridge br1 member interface vxlan1
set interfaces bridge br1 address '192.168.200.100/24'
set interfaces ethernet eth1 ip adjust-mss 1360
set interfaces bridge br1 mtu "1392"
# définition de l'âge des entrées MAC (MAC Address Aging time) pour le bridge br1. 300 secondes = 5 minutes
set interfaces bridge br1 aging '300'


